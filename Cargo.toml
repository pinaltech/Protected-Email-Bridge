[package]
name = "protected_email_bridge"
license = "MIT"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Local encrypted-mail gateway library: bridges an end-to-end encrypted mail API to standard mail clients (IMAP backend + SMTP submission)."
publish = false

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
bcrypt = "0.19.3"
chrono = "0.4.45"
crypto-bigint = { version = "0.7", features = ["zeroize"] }
encoding_rs = "0.8.44"
fcm_receiver_rs = { git = "https://github.com/agusibrahim/fcm_receiver.rs", rev = "fc4309843e7cc8220d382b5fe09b3e7697e08d83" }
futures = "0.3.34"
hex = "0.4.3"
httpdate = "1.0.3"
mail-parser = "1.0.1"
md-5 = "0.11.0"
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-traits = "0.2.19"
pgp = "0.21.1"
quoted_printable = "0.5.2"
rand = "0.10.3"
# rPGP 0.21 is built against the rand 0.8 trait family; this alias is only
# used to feed RNGs into OpenPGP operations.
rand08 = { package = "rand", version = "0.8.5" }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "query", "rustls", "http2"] }
rustls = "0.23"
rustls-platform-verifier = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4"] }
x509-parser = "0.18"
zeroize = "1.9.1"